[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scarlet-sails"
version = "0.2.0"
description = "Crypto trading research repo — quant strategies + RAG + human-in-the-loop"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "vectorbt>=0.26",
    "quantstats>=0.0.62",
]
