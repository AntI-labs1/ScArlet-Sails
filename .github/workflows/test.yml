name: tests

on:
  push:
    branches: [main, claude/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint stats module
        run: |
          python -c "import ast; ast.parse(open('paper/notebooks/stats.py').read())"
          python -c "import ast; ast.parse(open('passive/rebalance.py').read())"
          python -c "import ast; ast.parse(open('backtesting/vbt_engine.py').read())"

      - name: Validate JSON results
        run: |
          python -c "
          import json, glob
          for f in sorted(glob.glob('paper/results/*.json')):
              json.load(open(f))
              print(f'OK: {f}')
          "

      - name: Validate YAML configs
        run: |
          python -c "
          import yaml
          for f in ['passive/portfolios.yaml']:
              data = yaml.safe_load(open(f))
              print(f'OK: {f} ({len(data.get(\"portfolios\", {}))} portfolios)')
          "

      - name: Validate Jupyter notebooks (JSON structure)
        run: |
          python -c "
          import json, glob
          notebooks = sorted(glob.glob('paper/notebooks/*.ipynb') + glob.glob('kaggle/*.ipynb'))
          for f in notebooks:
              nb = json.load(open(f))
              cells = len(nb.get('cells', []))
              print(f'OK: {f} ({cells} cells)')
          "

      - name: Run pytest (stats module + utilities)
        run: |
          # Add paper/notebooks to PYTHONPATH so test_stats can import stats.py
          PYTHONPATH="$PWD/paper/notebooks:$PYTHONPATH" pytest tests/test_stats.py -v

      - name: Verify build.sh syntax
        run: bash -n paper/build.sh

  paper-build-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build HTML version (smoke test pandoc + bib)
        run: |
          pandoc paper/drafts/main.md \
            --bibliography=paper/drafts/references.bib \
            --citeproc \
            --to=html5 \
            --standalone \
            -o /tmp/paper.html
          ls -l /tmp/paper.html

      - name: Verify paper file size sanity
        run: |
          # Paper should be at least 20KB of HTML — guards against accidentally
          # empty or truncated build
          size=$(stat -c%s /tmp/paper.html)
          if [ "$size" -lt 20000 ]; then
            echo "ERROR: paper HTML is suspiciously small: $size bytes"
            exit 1
          fi
          echo "OK: paper HTML is $size bytes"
