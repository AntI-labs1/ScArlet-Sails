# =============================================================================
# ScArlet-Sails Council Configuration
# =============================================================================
# 
# Декларативная конфигурация системы.
# Редактируйте этот файл вместо изменения кода.
#
# Philosophy:
#   "Конфигурация > Код"
#   "Человек управляет через YAML, не через Python"
# =============================================================================

# Метаданные
name: "ScArlet-Sails Council"
version: "1.0.0"
description: "Quantitative trading decision support system"

# =============================================================================
# AGENTS
# =============================================================================
# Каждый агент — независимый модуль с единым интерфейсом.
# Веса определяют влияние на финальное решение.
# Priority определяет порядок вызова (больше = раньше).

agents:
  # Quant Agent — правила и ML модели
  - name: QuantAgent
    module: council.quant_agent
    class: QuantAgent
    weight: 0.30
    priority: 10
    enabled: true
    config:
      use_rule_based: true
      use_ml: true
      ml_threshold: 0.70
  
  # RAG Agent — исторические паттерны
  - name: RAGAgent
    module: rag.rag_agent
    class: RAGAgent
    weight: 0.30
    priority: 5
    enabled: true
    config:
      top_k: 5
      min_similarity: 0.6
      include_outcomes: true
  
  # LLM Agent — анализ контекста (твоя модель)
  - name: LLMAgent
    module: council.llm_agent
    class: LLMAgent
    weight: 0.40
    priority: 0
    enabled: false  # Включить после подключения LLM
    config:
      provider: custom
      endpoint: null  # Заполни URL своего LLM
      timeout_s: 30

# =============================================================================
# RAG CONFIGURATION
# =============================================================================
# Настройки системы retrieval-augmented generation.

rag:
  patterns_dir: "rag/patterns"
  index_dir: "rag/faiss_index"
  embedding_model: "all-MiniLM-L6-v2"
  top_k: 5
  min_similarity: 0.5
  auto_rebuild: true

# =============================================================================
# LLM CONFIGURATION
# =============================================================================
# Настройки LLM агента.
# Заполни после подключения своей модели.

llm:
  provider: "custom"           # custom / openai / anthropic
  model: ""                    # Название модели
  endpoint: null               # URL для custom LLM
  api_key_env: null            # Имя env переменной с API key
  temperature: 0.7
  max_tokens: 1000
  timeout_s: 30
  system_prompt_file: null     # Путь к файлу с system prompt
  fallback_enabled: true
  fallback_action: "hold"

# =============================================================================
# UI CONFIGURATION
# =============================================================================
# Настройки интерфейса.

ui:
  default: "terminal"
  
  terminal:
    colors: true
    unicode: true
    table_style: "rounded"
    show_charts: false
  
  web:
    host: "127.0.0.1"
    port: 8050
    debug: false
    auto_open: true

# =============================================================================
# LEARNING CONFIGURATION
# =============================================================================
# Настройки learning loop.

learning:
  enabled: true
  decisions_dir: "rag/decisions"
  auto_update_weights: false
  min_decisions_for_update: 20
  report_schedule: null  # "0 9 * * 1" = каждый понедельник 9:00

# =============================================================================
# RISK CONFIGURATION
# =============================================================================
# Настройки риск-менеджмента.

risk:
  max_position_pct: 10.0       # Максимальный размер позиции
  max_daily_loss_pct: 3.0      # Максимальный дневной убыток
  max_weekly_loss_pct: 7.0     # Максимальный недельный убыток
  default_sl_pct: 4.0          # Дефолтный стоп-лосс
  default_tp_pct: 8.0          # Дефолтный тейк-профит
  min_confidence: 0.5          # Минимальная уверенность для торговли
  min_agreement: 0.6           # Минимальное согласие агентов

# =============================================================================
# LOGGING
# =============================================================================

log_level: "info"              # debug / info / warning / error
log_file: null                 # Путь к файлу лога (null = только stdout)